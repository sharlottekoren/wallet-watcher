name: Go Unit Tests

# 1. Trigger this workflow on pushes or pull requests to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    # 2. Use a fresh, clean Ubuntu Linux virtual machine
    runs-on: ubuntu-latest

    steps:
    # 3. Check out your repository's code onto the runner machine
    - name: Check out code
      uses: actions/checkout@v4

    # 4. Set up the Go environment on the machine
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21' # Replace with your exact Go version if different
        cache-dependency-path: backend/go.sum

    # 5. Run your unit tests inside the backend directory
    - name: Run Go Tests
      run: |
        cd backend
        go test -v ./...