name: Format Check
on:
  pull_request:
    branches: [ main ]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Check Formatting
        run: |
          cd backend
          # This command returns a list of files that aren't formatted correctly
          if [ -n "$(go fmt ./...)" ]; then
            echo "Code is not formatted! Please run 'go fmt ./...' locally."
            exit 1
          fi